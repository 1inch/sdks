name: PR validation

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full history for affected commands

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2

      - name: Install Dependencies
        run: pnpm install

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build packages
        run: pnpm affected:build --base=origin/${{ github.base_ref }}

      - name: Lint affected packages
        run: pnpm affected:lint --base=origin/${{ github.base_ref }}

      - name: Type Check all packages
        run: pnpm lint:types

      - name: Test affected packages
        run: pnpm affected:test --base=origin/${{ github.base_ref }}
