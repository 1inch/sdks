name: PR validation

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full history for affected commands

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Dependencies
        run: pnpm install

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build packages
        run: pnpm affected:build --base=origin/${{ github.base_ref }}

      - name: Lint affected packages
        run: pnpm affected:lint --base=origin/${{ github.base_ref }}

      - name: Type Check all packages
        run: pnpm lint:types

      - name: Test affected packages
        run: pnpm affected:test --base=origin/${{ github.base_ref }}

  # Inlined from 1inch/workflows/.github/workflows/trivy-scan.yaml@trivy-scan-v1 (v1.0.8):
  # this repo is public and GitHub cannot call a reusable workflow that lives in the
  # private 1inch/workflows repo (every PR run failed at workflow expansion with zero jobs).
  dependabot-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy scan (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          skip-files: .npmrc
          limit-severities-for-sarif: false
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Fail on vulnerabilities
        # Gate scan of trivy-scan.yaml@v1.0.8 (table output, exit-code 1), run via
        # the trivy binary that the scan step above already installed on PATH.
        run: trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --skip-files .npmrc --format table --exit-code 1 .
